name: SonarQube Analysis

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      ########################################################
      # SONAR BEGIN - PR
      ########################################################

      - name: Sonar Begin (PR)
        if: github.event_name == 'pull_request'
        run: |
          dotnet sonarscanner begin \
            /k:"EmployeeManagement" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
            /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
            /d:sonar.pullrequest.base="${{ github.base_ref }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      ########################################################
      # SONAR BEGIN - BRANCH
      ########################################################

      - name: Sonar Begin (Branch)
        if: github.event_name != 'pull_request'
        run: |
          dotnet sonarscanner begin \
            /k:"EmployeeManagement" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      ########################################################
      # TESTS + COVERAGE
      ########################################################

      - name: Run Tests with Coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      ########################################################
      # GENERATE OPENCOVER REPORT
      ########################################################

      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate OpenCover Report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"OpenCover"

      - name: Verify Coverage Files
        run: |
          find . -name "*.xml"

      ########################################################
      # SONAR END
      ########################################################

      - name: Sonar End
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      ########################################################
      # QUALITY GATE
      ########################################################

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}