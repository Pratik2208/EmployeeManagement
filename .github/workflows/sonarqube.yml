name: SonarQube Analysis

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - master

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      ########################################################
      # Sonar Begin - Master
      ########################################################

      - name: Sonar Begin (Master)
        if: github.event_name == 'push'
        run: |
          dotnet sonarscanner begin \
            /k:"dotnet-crud-api" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/TestResults/coverage.opencover.xml"

      ########################################################
      # Sonar Begin - PR
      ########################################################

      - name: Sonar Begin (PR)
        if: github.event_name == 'pull_request'
        run: |
          dotnet sonarscanner begin \
            /k:"dotnet-crud-api" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
            /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
            /d:sonar.pullrequest.base="${{ github.base_ref }}" \
            /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/TestResults/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      ########################################################
      # Tests + Coverage
      ########################################################

      - name: Run Tests with Coverage
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --verbosity normal \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput="${GITHUB_WORKSPACE}/TestResults/coverage.opencover.xml"

      ########################################################
      # Verify Coverage Files (Debug)
      ########################################################

      - name: Verify Coverage Files
        if: always()
        run: |
          echo "=== GITHUB_WORKSPACE ==="
          echo $GITHUB_WORKSPACE

          echo "=== Current directory ==="
          pwd

          echo "=== Looking for any xml files ==="
          find . -name "*.xml" 2>/dev/null

          echo "=== Looking for TestResults anywhere ==="
          find . -name "TestResults" -type d 2>/dev/null

          echo "=== Looking for opencover files ==="
          find . -name "*.opencover.xml" 2>/dev/null

      ########################################################
      # Sonar End
      ########################################################

      - name: Sonar End
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      ########################################################
      # Quality Gate
      ########################################################

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}